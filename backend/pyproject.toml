[project]
name = "asr-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "djdcao6", email = "djdcao6@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.5.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rispy>=0.10.0",
    "sqlalchemy>=2.0.52",
    "stripe>=15.6.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
asr-backend = "asr_backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends() is idiomatic in argument defaults, not a bug.
ignore = ["B008"]

